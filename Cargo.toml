[package]
name = "rusty-psn"
version = "0.5.10"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dirs = "7.0.0"
bytesize = "2.7.0"
copypasta = "0.10.2"
sha1 = "0.11.0"
quick-xml = "0.42.0"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

log = "0.4.34"
flexi_logger = "0.31.10"

clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }

reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Named directly only to give reqwest a certificate check scoped to Sony hosts (src/security.rs).
# Both must stay on the versions reqwest itself uses, or reqwest rejects the TLS config.
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "aws-lc-rs"] }
rustls-platform-verifier = "0.7.1"

rfd = { version = "0.17.2", optional = true }
eframe = { version = "0.36.2", features = ["persistence"], optional = true }
egui-notify = { version = "0.23.0", optional = true }
notify-rust = { version = "4.18.2", optional = true }

serde = { version = "1.0.229", default-features = false, features = ["derive"] }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "rt-multi-thread", "io-util", "macros", "fs", "sync", "process"] }

[target.'cfg(unix)'.dependencies]
# O_NOFOLLOW for download files (src/utils.rs, download_file_options).
libc = "0.2.190"

[dev-dependencies]
# Reads stored window-app settings in tests; the same version eframe saves them with.
ron = "0.12.2"

[features]
default = ["egui"]
cli = ["crossterm"]
egui = ["rfd", "eframe", "egui-notify", "notify-rust"]
