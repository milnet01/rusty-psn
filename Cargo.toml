[package]
name = "rusty-psn"
version = "0.5.10"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dirs = "6.0.0"
bytesize = "2.7.0"
copypasta = "0.10.2"
sha1 = "0.11.0"
quick-xml = "0.42.0"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"

log = "0.4.34"
flexi_logger = "0.31.10"

clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }

reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls"] }

rfd = { version = "0.15.4", optional = true }
eframe = { version = "0.32.1", features = ["persistence"], optional = true }
egui-notify = { version = "0.20.0", optional = true }
notify-rust = { version = "4.18.2", optional = true }

poll-promise = { version = "0.3.0", features = ["tokio"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "io-util", "macros", "fs", "sync", "process"] }

[dev-dependencies]

[features]
default = ["egui"]
cli = ["crossterm"]
egui = ["rfd", "eframe", "egui-notify", "notify-rust"]
