<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#006FCD"/>
      <stop offset="100%" style="stop-color:#0053a0"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="8" y="8" width="240" height="240" rx="40" ry="40" fill="url(#bg)"/>
  <!-- PlayStation-style downward arrow (download) -->
  <path d="M128 55 L128 165" stroke="url(#accent)" stroke-width="22" stroke-linecap="round"/>
  <path d="M80 130 L128 178 L176 130" stroke="url(#accent)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Base line (tray/folder) -->
  <path d="M60 195 L196 195" stroke="#CE422B" stroke-width="16" stroke-linecap="round"/>
  <!-- Small R for Rust in bottom-right -->
  <text x="205" y="225" font-family="sans-serif" font-weight="bold" font-size="36" fill="#CE422B" text-anchor="middle">R</text>
</svg>
