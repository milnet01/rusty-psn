<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>rusty-psn — Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1014}
a{color:#8CC0FF}a:hover{color:#B9D8FF}
.nav a,.nav button{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:10px;color:#C9CED8;text-decoration:none;font:500 16px 'IBM Plex Sans',sans-serif;background:none;border:0;width:100%;cursor:pointer;text-align:left}
.nav a:hover,.nav button:hover{background:#1F242D;color:#FFFFFF}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #3A4250;background:#222833;color:#EEF0F4;font:600 15px 'IBM Plex Sans',sans-serif;display:inline-flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#2A313D}
.btn-primary{background:#2F6FDB;border-color:#2F6FDB;color:#FFFFFF}
.mono{font-family:'IBM Plex Mono',monospace}
.field{min-height:44px;box-sizing:border-box;padding:0 14px;border-radius:10px;border:1px solid #3A4250;background:#0E1014;color:#EEF0F4;font:400 16px 'IBM Plex Sans',sans-serif}
.card{background:#1A1E26;border:1px solid #2E3542;border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:18px}
.card h2{margin:0;font-size:19px}
.setting{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.setting > label:first-child,.setting > .lbl{flex:0 0 220px;font-weight:600}
.hint{color:#B4BAC6;font-size:15px;margin:0}
.choice{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 14px;border:1px solid #3A4250;border-radius:10px;cursor:pointer}
.choice input{width:20px;height:20px;accent-color:#4C9BFF}
</style>
</helmet>
<div style="min-height: 860px; display: flex; flex-wrap: wrap; background: #0E1014; color: #EEF0F4; font-family: 'IBM Plex Sans', sans-serif; font-size: 16px">

  <nav class="nav" aria-label="Main" style="flex: 1 1 220px; max-width: 240px; box-sizing: border-box; padding: 20px 14px; background: #14171D; border-right: 1px solid #2A303B; display: flex; flex-direction: column; gap: 4px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 20px">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4C9BFF" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle></svg>
      <span style="font-weight: 700; font-size: 19px">rusty-psn</span>
    </div>
    <a href="Main.dc.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>Search</a>
    <a href="Downloads.dc.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>Downloads<span style="margin-left: auto; background: #2F6FDB; color: #FFFFFF; border-radius: 999px; padding: 1px 9px; font-size: 13px; font-weight: 700">2</span></a>
    <a href="Library.dc.html">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="6" height="16" rx="1"></rect><rect x="14" y="4" width="6" height="16" rx="1"></rect></svg>RPCS3 library</a>
    <button type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8l8-4 8 4-8 4-8-4zM4 8v8l8 4 8-4V8"></path></svg>Patches and DLC</button>
    <button type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"></path></svg>Firmware</button>
    <button type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg>History</button>
    <div style="flex-grow: 1; min-height: 24px"></div>
    <a href="Settings.dc.html" aria-current="page" style="background: #233149; color: #FFFFFF; box-shadow: inset 3px 0 0 #4C9BFF">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"></path></svg>Settings</a>
  </nav>

  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <div style="flex-grow: 1; box-sizing: border-box; padding: 32px 40px; display: flex; flex-direction: column; gap: 20px; max-width: 900px; width: 100%">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">Settings</h1>

      <section class="card" aria-labelledby="s-look">
        <h2 id="s-look">Reading and display</h2>
        <div class="setting">
          <span class="lbl" id="ts">Text size</span>
          <div role="radiogroup" aria-labelledby="ts" style="display: flex; flex-wrap: wrap; gap: 8px">
            <label class="choice"><input type="radio" name="ts">Normal</label>
            <label class="choice" style="border-color: #4C9BFF; background: #172235"><input type="radio" name="ts" checked>Large</label>
            <label class="choice"><input type="radio" name="ts">Extra large</label>
          </div>
        </div>
        <div class="setting">
          <label for="theme">Colours</label>
          <select id="theme" class="field" style="flex: 0 1 260px">
            <option>Dark</option><option>Light</option><option selected>High contrast</option><option>PlayStation blue</option>
          </select>
        </div>
      </section>

      <section class="card" aria-labelledby="s-dl">
        <h2 id="s-dl">Downloads</h2>
        <div class="setting">
          <label for="dlpath">Save downloads in</label>
          <input id="dlpath" class="field mono" type="text" value="[YOUR DOWNLOAD FOLDER]" readonly style="flex: 1 1 260px">
          <button type="button" class="btn">Choose folder…</button>
        </div>
        <div class="setting">
          <label for="layout">Folder names</label>
          <select id="layout" class="field" style="flex: 1 1 260px">
            <option selected>Game title / Game ID — Batman - Arkham Origins/BLUS31147/</option>
            <option>Game ID — Game title — BLUS31147 - Batman Arkham Origins/</option>
            <option>Game ID only — BLUS31147/</option>
          </select>
        </div>
        <div class="setting">
          <label for="conc">Downloads at once</label>
          <input id="conc" type="range" min="1" max="10" value="3" style="flex: 0 1 220px; accent-color: #4C9BFF">
          <output for="conc" style="font-weight: 700; font-size: 18px">3</output>
        </div>
      </section>

      <section class="card" aria-labelledby="s-rp">
        <h2 id="s-rp">RPCS3</h2>
        <div class="setting">
          <span class="lbl">RPCS3 found</span>
          <span style="display: inline-flex; align-items: center; gap: 8px; color: #5BD192; font-weight: 600">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>Yes — found automatically</span>
          <span style="flex-grow: 1"></span>
          <button type="button" class="btn">Use a different RPCS3…</button>
        </div>
        <p class="hint">rusty-psn looks for RPCS3 in the usual places. Pick one yourself only if it found the wrong copy.</p>
      </section>

      <section class="card" aria-labelledby="s-nt">
        <h2 id="s-nt">Notifications</h2>
        <label class="choice" style="border: 0; padding: 0"><input type="checkbox" checked>Show messages inside the app</label>
        <label class="choice" style="border: 0; padding: 0"><input type="checkbox">Also show them as desktop notifications</label>
      </section>
    </div>

    <footer style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 40px; background: #172235; border-top: 1px solid #2F4F7F">
      <span style="font-weight: 600">You have unsaved changes</span>
      <span style="flex-grow: 1"></span>
      <button type="button" class="btn">Undo changes</button>
      <button type="button" class="btn btn-primary">Save</button>
    </footer>
  </main>
</div>
</x-dc>

}

</body>
</html>
