on: pull_request

name: Check formatting

permissions: {}

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checks out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@f0d5300ba8908d942c808f4d31c08471d7798ba3 # nightly
        with:
          components: rustfmt
      - name: Run rustfmt
        run: cargo +nightly fmt --check
