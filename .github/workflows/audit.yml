on:
  push:
  pull_request:
  schedule:
    # Weekly, so a new advisory against an unchanged lockfile is still found.
    - cron: "17 4 * * 1"

name: Dependency audit

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces an older run; master keeps every run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust Cache (keeps the installed cargo-audit)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-audit (version pinned in scripts/local-ci.sh)
        run: |
          version=$(sed -n "s/^CARGO_AUDIT_VERSION='\(.*\)'$/\1/p" scripts/local-ci.sh)
          cargo install cargo-audit --locked --version "$version"

      - name: Run cargo audit
        run: cargo audit
