on: pull_request

name: Clippy lint check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push replaces an older run; master keeps every run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  clippy:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        feature: ["cli", "egui"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: clippy-${{ matrix.feature }}

      - name: Install dependencies (egui)
        if: ${{ matrix.feature == 'egui' }}
        run: |
          sudo apt update
          sudo apt-get install libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libspeechd-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Run clippy
        run: cargo clippy --no-default-features --features ${{ matrix.feature }} -- -D warnings
