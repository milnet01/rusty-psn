name: Remove old artifacts

on:
  push:
    branches:
      - master

permissions: {}

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write # deletes old build artifacts

    steps:
    - name: Remove old artifacts
      uses: c-hive/gha-remove-artifacts@62c2fbea931baa7dd4a6b73ea5a799984a818f61 # v1.8.0
      with:
        age: '2 days'
        skip-recent: 2
